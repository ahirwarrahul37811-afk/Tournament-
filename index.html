<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena India – BGMI & Free Fire MAX Tournaments</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#14161c;--mu:#667;--bd:#dde0e8;--ac:#ff5a1f;--ok:#12a150;--bad:#d62839;--bg2:#eceef3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--card:#181b23;--tx:#eef0f5;--mu:#98a0b3;--bd:#2a2f3b;--bg2:#10131a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px}.logo b{color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);padding:7px 13px;border-radius:8px;text-decoration:none;display:inline-block}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.sm{padding:4px 9px;font-size:13px}button.bad{color:var(--bad)}button.ok{color:var(--ok)}
main{max-width:1000px;margin:0 auto;padding:18px}
h2{margin:6px 0 14px}h3{margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd)}
.tag.b{color:#e8a200}.tag.f{color:#ff5a1f}
.row{display:flex;justify-content:space-between;gap:8px;margin:3px 0;color:var(--mu);font-size:14px}.row b{color:var(--tx)}
.bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.st-pending{color:#e8a200}.st-approved{color:var(--ok)}.st-rejected{color:var(--bad)}
.msg{padding:9px 12px;border-radius:8px;background:var(--bg2);border:1px solid var(--bd);margin:10px 0}
.room{margin-top:8px;padding:8px;border:1px dashed var(--ok);border-radius:8px;font-size:14px}
.mu{color:var(--mu)}
</style></head><body>
<header><div class="logo">ARENA<b>.IN</b> 🎮</div><nav id="nav"></nav></header>
<main id="app"><p class="mu">Loading…</p></main>
<script>
const MINW=80,REF=5;
const API=''; // Netlify par rakhoge to yahan Render ka link daalo, jaise 'https://arena-india.onrender.com' (end mein / mat lagao). Render se hi site chalao to khali rehne do.
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=null;try{tok=localStorage.getItem('tok')}catch(e){}
let U=tok?1:null,P=undefined,T=[],R=[],W=[],L=[],ROOM={},AU=[],AR=[],AW=[],AROOM={},view='home',filter='All',atab='tours',regTid=null;
const adm=()=>!!(P&&P.admin);
const need={Solo:1,Duo:2,Squad:4};
const fmt=d=>new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const er=(i,m)=>{const e=$('#'+i);if(e)e.textContent=m};
async function api(path,body){const o={headers:{'Content-Type':'application/json'}};if(tok)o.headers.Authorization='Bearer '+tok;if(body!==undefined){o.method='POST';o.body=JSON.stringify(body)}
 const r=await fetch(API+'/api'+path,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
async function refresh(){try{const s=await api('/state');if(tok&&!s.me)setTok(null);U=s.me?1:null;P=s.me||null;T=s.tours;R=s.regs||[];W=s.wd||[];L=s.log||[];ROOM=s.rooms||{};AU=s.users||[];AR=s.allRegs||[];AW=s.allWd||[];AROOM=s.allRooms||{}}catch(e){if(P===undefined)P=null}rr()}
async function act(path,body,eid){try{await api(path,body);await refresh();return true}catch(x){eid?er(eid,x.message):alert(x.message);return false}}
function setTok(t){tok=t;try{t?localStorage.setItem('tok',t):localStorage.removeItem('tok')}catch(e){}}
function logout(){setTok(null);U=null;P=null;R=[];W=[];L=[];view='home';render()}
function rr(){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;render()}
function nav(){const items=[['home','Tournaments'],['status',U?'My Wallet':'Login / Sign up']];if(adm())items.push(['admin','Admin Panel']);
$('#nav').innerHTML=items.map(([k,l])=>`<button class="${view==k||(k=='home'&&view=='reg')?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){nav();if(view=='admin'&&!adm())view='home';({home,reg,status,admin:adminView})[view]()}

function card(t,showBtn=true){const n=t.taken||0,full=n>=t.slots;
return `<div class="card"><span class="tag ${t.game=='BGMI'?'b':'f'}">${esc(t.game)}</span> <span class="tag">${esc(t.mode)}</span>
<h3 style="margin:8px 0">${esc(t.name)}</h3>
<div class="row">Starts<b>${fmt(t.date)}</b></div><div class="row">Entry fee<b>₹${t.fee}</b></div><div class="row">Prize pool<b>₹${t.prize}</b></div>
<div class="row">Slots<b>${n}/${t.slots}</b></div><div class="bar"><i style="width:${Math.min(100,n/t.slots*100)}%"></i></div>
${showBtn?`<button class="pri" ${full?'disabled':''} onclick="regTid='${t.id}';go('reg')">${full?'Slots Full':'Register Now'}</button>`:''}</div>`}
function home(){const list=T.filter(t=>filter=='All'||t.game==filter);
$('#app').innerHTML=`<h2>Upcoming Tournaments</h2><div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
${['All','BGMI','Free Fire MAX'].map(f=>`<button class="${filter==f?'on':''}" onclick="filter='${f}';home()">${f}</button>`).join('')}</div>
<div class="grid">${list.map(t=>card(t)).join('')||'<p class="mu">No tournaments yet.</p>'}</div>`}

function reg(){const t=T.find(x=>x.id==regTid);if(!t)return go('home');if(!U||!P)return go('status');const k=need[t.mode];
let mem='';for(let i=2;i<=k;i++)mem+=`<div class="f2"><div><label>Player ${i} name</label><input class="pn"></div><div><label>Player ${i} Game UID</label><input class="pu"></div></div>`;
$('#app').innerHTML=`<h2>Register</h2><div style="max-width:560px">${card(t,false)}
<div class="card" style="margin-top:14px"><div class="msg">Pay <b>₹${t.fee}</b> to UPI <b>${esc(t.upi)}</b>, then enter the UTR / transaction ID below. Admin approves after checking payment.</div>
<label>${k>1?'Team name':'Display name'}</label><input id="team">
<div class="f2"><div><label>Player 1 (Leader) in-game name</label><input id="ign"></div><div><label>Game UID</label><input id="uid" inputmode="numeric"></div></div>
${mem}<label>UTR / Txn ID</label><input id="utr">
<p id="err" style="color:var(--bad)"></p><button class="pri" onclick="submitReg('${t.id}')">Submit Registration</button> <button onclick="go('home')">Cancel</button></div></div>`}
async function submitReg(id){const t=T.find(x=>x.id==id),v=i=>($('#'+i).value||'').trim(),e=m=>er('err',m);
const players=[{n:v('ign'),u:v('uid')}],ns=[...document.querySelectorAll('.pn')],us=[...document.querySelectorAll('.pu')];ns.forEach((x,i)=>players.push({n:x.value.trim(),u:us[i].value.trim()}));
if(!v('team')||players.some(p=>!p.n))return e('Fill team and all player names.');
if(!/^\d{6,15}$/.test(v('uid')))return e('Enter a valid Game UID (digits).');
if(!/^[\w\-]{8,30}$/.test(v('utr')))return e('Enter a valid UTR / transaction ID (letters and digits only).');
if((t.taken||0)>=t.slots)return e('Sorry, slots are full.');
try{await api('/register',{tid:id,team:v('team'),players,utr:v('utr')});await refresh();go('status')}catch(x){e(x.message)}}

async function login(){try{const r=await api('/login',{phone:$('#lp').value.trim(),pin:$('#lq').value.trim()});setTok(r.token);await refresh()}catch(x){er('e1',x.message)}}
async function signup(){const v=i=>$('#'+i).value.trim();try{const r=await api('/signup',{name:v('sn'),phone:v('sp'),pin:v('sq'),ref:v('sr')});setTok(r.token);await refresh()}catch(x){er('e2',x.message)}}
async function withdraw(){const a=+$('#wa').value,up=$('#wu').value.trim();
if(!(a>=MINW)||a!=Math.floor(a))return er('e3','Minimum withdrawal is ₹'+MINW+' (whole rupees).');if(a>P.bal)return er('e3','Not enough balance.');
if(!/^[\w.\-]{2,}@\w{2,}$/.test(up))return er('e3','Enter a valid UPI ID.');
await act('/withdraw',{amt:a,upi:up},'e3')}

function status(){const A=$('#app');
if(!U){A.innerHTML=`<h2>Login / Sign up</h2><div class="grid"><div class="card"><h3 style="margin-top:0">Login</h3><label>Mobile number</label><input id="lp" inputmode="tel" maxlength="10"><label>PIN</label><input id="lq" type="password" inputmode="numeric"><p id="e1" style="color:var(--bad)"></p><button class="pri" onclick="login()">Login</button></div>
<div class="card"><h3 style="margin-top:0">New account</h3><label>Name</label><input id="sn"><label>Mobile number (1 number = 1 account)</label><input id="sp" inputmode="tel" maxlength="10"><label>Create PIN (4-6 digits)</label><input id="sq" type="password" inputmode="numeric" maxlength="6"><label>Referral code (optional)</label><input id="sr"><p id="e2" style="color:var(--bad)"></p><button class="pri" onclick="signup()">Create account</button></div></div>`;return}
if(P===undefined){A.innerHTML='<p class="mu">Loading…</p>';return}
const u=P,earned=L.filter(l=>String(l.n).startsWith('Referral')).reduce((s,l)=>s+l.a,0),
txt=encodeURIComponent('Join Arena India BGMI & Free Fire tournaments! Sign up with my code '+u.code+' - '+location.href.split('#')[0]);
A.innerHTML=`<h2>Hi, ${esc(u.name)} <button class="sm" onclick="logout()">Logout</button></h2><div class="grid">
<div class="card"><span class="tag">Wallet</span><h2 style="margin:8px 0">₹${u.bal}</h2><div class="mu">Winnings + referral earnings. Minimum withdrawal ₹${MINW}.</div>
<label>Amount (₹)</label><input id="wa" type="number" min="${MINW}"><label>Your UPI ID</label><input id="wu"><p id="e3" style="color:var(--bad)"></p><button class="pri" onclick="withdraw()">Withdraw</button></div>
<div class="card"><span class="tag">Refer &amp; Earn</span><h3 style="margin:8px 0">₹${REF} per friend</h3><div class="row">Your code<b>${esc(u.code)}</b></div><div class="row">Friends approved<b>${Math.round(earned/REF)}</b></div><div class="row">Earned<b>₹${earned}</b></div>
<p class="mu">You get ₹${REF} when your friend's first registration is approved. One mobile number = one account.</p><a class="btn" href="https://wa.me/?text=${txt}" target="_blank" rel="noopener">Share on WhatsApp</a></div></div>
<h3>My registrations</h3><div class="grid">${R.map(r=>{const t=T.find(x=>x.id==r.tid)||{},rm=ROOM[r.tid];return `<div class="card"><b>${esc(t.name)}</b> <span class="tag">${esc(t.game)}</span>
<div class="row">Team<b>${esc(r.team)}</b></div><div class="row">Status<b class="st-${r.status}">${r.status.toUpperCase()}</b></div>
${r.status=='approved'?(rm&&rm.room?`<div class="room">Room ID: <b>${esc(rm.room)}</b><br>Password: <b>${esc(rm.pass)}</b></div>`:'<div class="room mu">Room details will appear here before match time.</div>'):'<p class="mu">Payment is being verified by admin.</p>'}</div>`}).join('')||'<p class="mu">No registrations yet.</p>'}</div>
<h3>Withdrawals</h3><div class="card wrap"><table><tr><th>Amount</th><th>UPI</th><th>Status</th></tr>${W.map(w=>`<tr><td>₹${w.amt}</td><td>${esc(w.upi)}</td><td class="st-${w.s=='paid'?'approved':w.s=='pending'?'pending':'rejected'}">${w.s}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">None yet.</td></tr>'}</table></div>
<h3>Wallet history</h3><div class="card wrap"><table>${L.map(l=>`<tr><td>${fmt(l.t)}</td><td>${esc(l.n)}</td><td class="${l.a<0?'st-rejected':'st-approved'}">${l.a<0?'-':'+'}₹${Math.abs(l.a)}</td></tr>`).join('')||'<tr><td class="mu">No transactions yet.</td></tr>'}</table></div>`}

/* ---------- Admin ---------- */
const nm=id=>(AU.find(u=>u.id==id)||{}).name||id;
function adminView(){const tabs=[['tours','Tournaments'],['regs','Registrations'],['wallet','Wallet & Users'],['add','+ Add Tournament']];
let h=`<h2>Admin Panel</h2><div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${tabs.map(([k,l])=>`<button class="${atab==k?'on':''}" onclick="atab='${k}';adminView()">${l}</button>`).join('')}</div>`;
if(atab=='wallet')h+=walletView();if(atab=='add')h+=addForm();
if(atab=='tours')h+=`<div class="grid">${T.map(t=>{const r=AROOM[t.id]||{};return `<div class="card">${card(t,false).replace(/^<div class="card">|<\/div>$/g,'')}
<label>Room ID</label><input id="rm${t.id}" value="${esc(r.room)}"><label>Room password</label><input id="rp${t.id}" value="${esc(r.pass)}">
<div style="margin-top:10px;display:flex;gap:6px"><button class="sm ok" onclick="setRoom('${t.id}')">Publish room</button><button class="sm bad" onclick="delT('${t.id}')">Delete</button></div></div>`}).join('')}</div>`;
if(atab=='regs')h+=`<div class="card wrap"><table><tr><th>Tournament</th><th>Team</th><th>Players (UID)</th><th>Phone</th><th>UTR</th><th>Status</th><th></th></tr>
${AR.map(r=>{const t=T.find(x=>x.id==r.tid)||{name:'(deleted)'};return `<tr><td>${esc(t.name)}</td><td>${esc(r.team)}</td><td>${r.players.map(p=>esc(p.n)+(p.u?' ('+esc(p.u)+')':'')).join(', ')}</td><td>${esc(r.phone)}</td><td>${esc(r.utr)}</td><td class="st-${r.status}">${r.status}</td>
<td>${r.status=='pending'?`<button class="sm ok" onclick="approve('${r.id}')">Approve</button> `:''}<button class="sm bad" onclick="rejectR('${r.id}')">Reject</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">No registrations yet.</td></tr>'}</table></div><p class="mu">Reject removes the registration, frees the slot and lets the player re-submit with the correct UTR.</p>`;
$('#app').innerHTML=h}
function approve(id){act('/admin/approve',{id})}
function rejectR(id){if(confirm('Reject and remove this registration?'))act('/admin/reject',{id})}
function walletView(){const ap=AR.filter(r=>r.status=='approved'),col=ap.reduce((s,r)=>s+((T.find(t=>t.id==r.tid)||{}).fee||0),0),
owed=AU.reduce((s,u)=>s+u.bal,0),sum=st=>AW.filter(w=>w.s==st).reduce((s,w)=>s+w.amt,0),pend=sum('pending'),paid=sum('paid');
return `<div class="grid"><div class="card"><span class="tag">Admin wallet</span><h2 style="margin:8px 0">₹${col-paid-owed-pend}</h2>
<div class="row">Entry fees collected (approved)<b>₹${col}</b></div><div class="row">Owed to users<b>₹${owed}</b></div><div class="row">Withdrawals pending<b>₹${pend}</b></div><div class="row">Paid out<b>₹${paid}</b></div></div>
<div class="card"><h3 style="margin:0">Credit winnings</h3><label>Approved team</label><select id="aw">${ap.map(r=>`<option value="${r.id}">${esc((T.find(t=>t.id==r.tid)||{}).name)} – ${esc(r.team)}</option>`).join('')||'<option value="">No approved teams</option>'}</select>
<label>Amount (₹)</label><input id="aa" type="number" min="1"><button class="pri" style="margin-top:10px" onclick="award()">Add to user wallet</button></div></div>
<h3>Withdrawal requests</h3><div class="card wrap"><table><tr><th>User</th><th>Phone</th><th>Amount</th><th>UPI</th><th>Status</th><th></th></tr>${AW.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.phone)}</td><td>₹${w.amt}</td><td>${esc(w.upi)}</td><td>${w.s}</td><td>${w.s=='pending'?`<button class="sm ok" onclick="wdSet('${w.id}','paid')">Mark paid</button> <button class="sm bad" onclick="wdSet('${w.id}','rejected')">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">No requests.</td></tr>'}</table></div>
<h3>Users</h3><div class="card wrap"><table><tr><th>Name</th><th>Phone</th><th>Balance</th><th>Code</th><th>Referred by</th></tr>${AU.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>₹${u.bal}</td><td>${esc(u.code)}</td><td>${esc(u.by?nm(u.by):'-')}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No users yet.</td></tr>'}</table></div>`}
function award(){const a=+$('#aa').value,id=$('#aw').value;if(!id||!(a>0))return alert('Pick a team and enter an amount.');act('/admin/award',{id,amt:a})}
function wdSet(id,s){act('/admin/wd',{id,s})}
function addForm(){return `<div class="card" style="max-width:560px"><label>Game</label><select id="g"><option>BGMI</option><option>Free Fire MAX</option></select>
<label>Tournament name</label><input id="n"><div class="f2"><div><label>Date & time</label><input id="d" type="datetime-local"></div><div><label>Mode</label><select id="m"><option>Solo</option><option>Duo</option><option selected>Squad</option></select></div>
<div><label>Entry fee (₹)</label><input id="f" type="number" min="0" value="50"></div><div><label>Prize pool (₹)</label><input id="p" type="number" min="0" value="1000"></div>
<div><label>Total slots</label><input id="s" type="number" min="2" value="25"></div><div><label>UPI ID for payment</label><input id="u" value="arena@upi"></div></div>
<p id="err" style="color:var(--bad)"></p><button class="pri" onclick="addT()">Create Tournament</button></div>`}
async function addT(){const v=i=>$('#'+i).value.trim();if(!v('n')||!v('d')||!v('u'))return er('err','Name, date and UPI are required.');
if(await act('/admin/tour',{game:v('g'),name:v('n'),date:v('d'),mode:v('m'),fee:+v('f')||0,prize:+v('p')||0,slots:+v('s')||25,upi:v('u')},'err')){atab='tours';adminView()}}
function setRoom(id){act('/admin/room',{id,room:$('#rm'+id).value.trim(),pass:$('#rp'+id).value.trim()})}
function delT(id){if(confirm('Delete this tournament and its registrations?'))act('/admin/deltour',{id})}
render();refresh();setInterval(refresh,15000);
</script></body></html>
